<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17324d">
<title>Anish Raj Arisetty | Social Links</title>
<style>
  :root {
    --navy: #17324d;
    --blue: #2f648f;
    --ink: #202b35;
    --muted: #66727d;
    --paper: #f7f4ee;
    --white: #fffdfa;
    --line: #ddd8cf;
    --soft-blue: #e8f0f5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .top {
    height: 190px;
    background: var(--navy);
    position: absolute;
    inset: 0 0 auto 0;
  }

  .page {
    position: relative;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 54px 20px 44px;
  }

  .card {
    background: var(--white);
    border: 1px solid rgba(23, 50, 77, .10);
    box-shadow: 0 12px 36px rgba(30, 40, 50, .09);
    border-radius: 18px;
    overflow: hidden;
  }

  .profile {
    text-align: center;
    padding: 34px 24px 30px;
    border-bottom: 1px solid var(--line);
  }

  .avatar {
    width: 88px;
    height: 88px;
    margin: -4px auto 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--soft-blue);
    color: var(--navy);
    border: 5px solid var(--white);
    box-shadow: 0 3px 12px rgba(23, 50, 77, .12);
    font-size: 25px;
    font-weight: 700;
    letter-spacing: .5px;
  }

  h1 {
    margin: 0;
    color: var(--navy);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -.5px;
  }

  .role {
    margin-top: 7px;
    color: var(--blue);
    font-size: 14px;
    font-weight: 600;
  }

  .description {
    max-width: 430px;
    margin: 14px auto 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
  }

  .links {
    padding: 20px;
    display: grid;
    gap: 10px;
  }

  .link {
    min-height: 66px;
    display: flex;
    align-items: center;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
    text-decoration: none;
    transition: .15s ease;
  }

  .link:hover {
    border-color: #aebdca;
    background: #f8fafb;
    transform: translateY(-1px);
  }

  .icon {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    margin-right: 14px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--soft-blue);
    color: var(--navy);
    font-size: 16px;
    font-weight: 700;
  }

  .details { min-width: 0; }

  .name {
    display: block;
    font-size: 15px;
    font-weight: 650;
  }

  .handle {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .arrow {
    margin-left: auto;
    padding-left: 12px;
    color: #84919c;
    font-size: 20px;
  }

  .footer {
    text-align: center;
    padding: 4px 20px 22px;
    color: #8b918f;
    font-size: 11px;
  }

  @media (max-width: 480px) {
    .top { height: 170px; }
    .page { padding: 40px 14px 30px; }
    .profile { padding: 30px 18px 26px; }
    h1 { font-size: 24px; }
    .links { padding: 15px; }
  }
</style>
</head>
<body>

<div class="top"></div>

<main class="page">
  <section class="card">

    <header class="profile">
      <div class="avatar">AR</div>
      <h1>Anish Raj Arisetty</h1>
      <div class="role">Software Developer · Technology Enthusiast</div>
      <p class="description">
        Professional profile, projects, and social media.
      </p>
    </header>

    <section class="links">

      <a class="link" href="https://www.linkedin.com/in/anishrajarisetty/" target="_blank" rel="noopener">
        <span class="icon">in</span>
        <span class="details">
          <span class="name">LinkedIn</span>
          <span class="handle">Professional profile · anishrajarisetty</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link" href="https://x.com/ShadowSpearYT1" target="_blank" rel="noopener">
        <span class="icon">𝕏</span>
        <span class="details">
          <span class="name">X</span>
          <span class="handle">@ShadowSpearYT1</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link" href="https://www.youtube.com/@shadowspear9639" target="_blank" rel="noopener">
        <span class="icon">▶</span>
        <span class="details">
          <span class="name">YouTube</span>
          <span class="handle">@shadowspear9639</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link" href="https://www.instagram.com/shadowspear_yt" target="_blank" rel="noopener">
        <span class="icon">◎</span>
        <span class="details">
          <span class="name">Instagram</span>
          <span class="handle">@shadowspear_yt</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="link" href="https://www.facebook.com/anishraj.arisetty/" target="_blank" rel="noopener">
        <span class="icon">f</span>
        <span class="details">
          <span class="name">Facebook</span>
          <span class="handle">anishraj.arisetty</span>
        </span>
        <span class="arrow">›</span>
      </a>

    </section>

  </section>
</main>

</body>
</html>
